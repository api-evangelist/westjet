actions:
  apisYmlCreated: true
  apisListed: 1
  openapiDirectoryCreated: false
  openapiReason: >-
    No machine-readable contract of any kind was found. WestJet publishes no OpenAPI,
    Swagger, WSDL, XSD, JSON Schema, Postman collection or AsyncAPI. The NDC schemas
    themselves are IATA artifacts distributed by IATA under its own terms, not by
    WestJet, so nothing was harvested. Creating an openapi/ directory would have meant
    fabricating one.
  gated: true
  portalConfirmed: false
  portalConfirmedReason: >-
    westjetndc.com returns HTTP 200 and is genuinely public documentation, but it is
    not a self-serve developer portal: there is no signup that issues credentials, no
    sandbox, no key, no spec and no console. Every path to the API runs through an
    accreditation check and a human.
