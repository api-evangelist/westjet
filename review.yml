switchingCost:
  interfaceShape:
    value: standard-plus-proprietary
    standardsNamed:
      - name: IATA New Distribution Capability (NDC)
        versions:
          - '17.2'
          - 21.3/24.1
        evidence: >-
          westjetndc.com/connection-options/: "Travel partners with an existing user
          interface and technical infrastructure can integrate directly with
          WestJet's Direct Connect API. This option is available in versions 17.2 or
          21.3/24.1". The registration form's "NDC API Version" field offers
          "NDC 17.2", "NDC 21.3/24.1", "NDC SPRK (17.2)".
      - name: IATA/ATA EDIFACT
        note: >-
          The incumbent GDS interface. westjetndc.com/benefits/ contrasts the
          "NDC (17.2 and 21.3/24.1)" column against an "EDIFACT" column.
      - name: IATA Resolution 824 (agency obligations)
        evidence: >-
          ADM policy: "Agency obligations are described in IATA Resolution 824, which
          states that an Agent should issue tickets in compliance with Carrier's
          fares, fare rules, general conditions of carriage and written instructions
          of the carrier."
      - name: IATA Resolution 850m (ADM audit and issuance)
        evidence: >-
          ADM policy: "The WestJet policy for audit and memo issuance will be handled
          per IATA Resolution 850m."
      - name: IATA BSP / ARC settlement
        evidence: >-
          Capability matrix rows "Settlement via BSP" and "Settlement via ARC";
          disputes routed through BSPLink (portal.iata.org) and ARC Memo Manager
          (myarc.arccorp.com).
    proprietaryExtensions:
      - >-
        Fare-bundle encoding is WestJet-specific: bundle identity is carried in the
        seventh character of the fare basis code (B = UltraBasic, E = Econo,
        F = EconoFlex, P = Premium, R = PremiumFlex), documented at
        westjettravelagents.com/policy-library/how-to-identify-westjet-fare-bundles-in-the-gds/.
        A consumer parsing WestJet fares has written WestJet-only parsing logic.
      - >-
        UltraBasic fares are content-gated to the direct and NDC channels: FAQ —
        "UltraBasic fares will be exclusively available through NDC channels."
      - >-
        The Direct Connect endpoint, the "WestJet portal" and the support desk are
        all Accelya/Farelogix assets (sprk.accelya.io,
        farelogixpartnersupport.zendesk.com, accelyastatus.statuspage.io). The
        registration form asks "Have you completed an indirect Distribution
        connection with Accelya before (NDC, FLX or via SPRK)?" — prior Accelya
        integration is treated as the qualifying credential.
      - >-
        Capability is not uniform across the standard: the published matrix shows
        "Book and instant ticket" supported only on WestJet Direct Connect, and
        "Multiple forms of payment" only on Direct Connect and SPRK. The same NDC
        version does not buy the same behaviour from a different channel.
    note: >-
      The wire format is an open IATA standard, which is the single most important
      mitigating fact here — an NDC 21.3 integration is transferable in shape to any
      other NDC carrier. But WestJet layers proprietary fare-basis semantics, channel-
      exclusive content and vendor-specific enrolment on top, so the integration is
      portable in protocol and not portable in meaning.

  secondSource:
    value: no-alternative
    reasoning: >-
      For the capability that matters — selling a seat on a WestJet aircraft — there
      is no second source. WestJet is the sole issuer of its own inventory. What the
      market offers is a choice of ROUTE to that inventory, not a choice of supplier.
    alternativesConsidered:
      - name: WestJet Direct Connect API (Accelya-hosted)
        available: true
        note: Broadest capability set; requires IATA or ARC accreditation and approval
      - name: WestJet portal (Accelya SPRK 17.2)
        available: true
        note: Free web UI, not an API; requires Direct Connect credentials first
      - name: Amadeus
        available: true
        note: Capability matrix shows NDC 17.2, most rows marked "Q3 2026"
      - name: Sabre
        available: true
        note: Capability matrix shows NDC 17.2 with the widest set of live checkmarks among GDSs
      - name: Travelport
        available: true
        note: Capability matrix shows NDC 21.3/24.1, most rows marked "Q3 2026"
      - name: Travelfusion
        available: true
        note: Named aggregator; NDC 17.2; several rows unsupported
      - name: WestJet Agent Direct
        available: true
        note: >-
          Direct agency booking web app, no API. Deliberately positioned in the
          registration form as the fallback for TIDS-only and sub-$1M agencies.
      - name: Third-party NDC aggregators (e.g. Duffel)
        available: true
        note: >-
          duffel.com/flights/airlines/westjet returns HTTP 200 and advertises WestJet
          content, which is an alternative route rather than an alternative supplier.
      - name: Air Canada, Porter, Flair, Lynx
        available: false
        note: >-
          Substitute airlines, not substitute sources of WestJet inventory. A
          consumer that must sell WestJet cannot get WestJet from them.
    switchCostBetweenChannels: >-
      Real but bounded, and asymmetric. Moving from Direct Connect to a GDS costs
      capability (book-and-instant-ticket, multiple forms of payment, some servicing)
      and the NDC incentive. Moving from EDIFACT to NDC costs an integration project.
      Staying on EDIFACT costs $20-$22 USD per booking on the lowest class per cabin
      and loses access to UltraBasic entirely.

  exitPath:
    value: export-on-request
    consumerData:
      operation: Guest information report
      url: https://www.westjet.com/en-ca/legal/privacy-policy/privacy-requests
      status: 200
      evidence: >-
        "For a copy of your personal data, please request a Guest information report";
        deletion via "Request to be Forgotten". The page adds: "WestJet may be
        required to verbally authenticate these requests. Please anticipate a phone
        call."
      machineReadable: false
      note: >-
        No format is specified, no schema is published, no endpoint exists. This is a
        PIPEDA-style access right implemented as a web form plus a phone call, not
        data portability in any engineering sense.
    agencyData:
      bulkExport: none
      note: >-
        No export, dump, bulk or reporting operation is documented anywhere on
        westjetndc.com, westjettravelagents.com or WestJet Agent Direct. Agency
        financial records exist in BSPLink and ARC Memo Manager — which are IATA and
        ARC systems, not WestJet systems — so what an agency can retrieve about its
        WestJet transactions it retrieves from the settlement body, not the carrier.
    orderData:
      note: >-
        The capability matrix exposes read operations on a single order ("View issued
        ticket information", "View issued EMD details", "View all ancillary services
        included, purchased or still supported within the order") but nothing that
        enumerates or exports an agency's book of business.

  identifierPortability:
    summary: >-
      Predominantly shared industry identifiers, with one meaningful proprietary
      layer in fare encoding.
    portableIdentifiers:
      - IATA airline designator WS (ICAO WJA)
      - IATA 838 ticket stock / airline accounting code
      - PNR record locators (matrix row "Split/divide PNR"; "How to claim a WestJet Groups PNR")
      - Electronic ticket numbers and EMD-A documents for bags and pre-reserved seats
      - IATA airport codes throughout (YYC, YVR, YXX, YYZ, YHM appear in the ticketing policy)
      - IATA accreditation numbers, ARC numbers, ARC VTC, IATA TSI and IATA TIDS numbers
      - Redress Control Number (13-digit DHS identifier) and TSA Secure Flight Passenger Data
      - Special Service Request (SSR) and Other Service Information (OSI) codes
      - ATPCO fare categories (CAT 31 exchanges, CAT 33 refunds)
    proprietaryIdentifiers:
      - >-
        Fare basis bundle encoding — the seventh character of the fare basis code
        denotes the WestJet bundle, and the first character may or may not match the
        booking class depending on bundle. This is WestJet-authored semantics carried
        inside an industry-standard field.
      - WestJet waiver codes for voluntary and involuntary exchanges
      - WestJet Rewards member IDs and WestJet dollars balances
      - Accelya/Farelogix-issued Direct Connect enrolment credentials
    evidence: >-
      ticketing policy definitions block; adm-fee-schedule "Value Calculation Details"
      table; westjetndc.com/capabilities/ matrix rows; how-to-identify-westjet-fare-
      bundles-in-the-gds.
    note: >-
      Because the identifiers are mostly IATA's, a booking made through WestJet is
      addressable by another system. That is a genuine anti-lock-in property and it
      exists because the industry, not WestJet, owns the namespace.

  contractualLockIn:
    published: true
    primaryDocument: https://westjettravelagents.com/policy-library/ticketing-policy/
    verbatim:
      - clause: Unilateral amendment
        text: >-
          "1.02 Any Booking or Ticketing of air transportation operated and/or
          marketed by WestJet by an Agent (as defined herein) shall be subject to the
          terms and conditions of this Policy, as the same may be amended from time to
          time by WestJet in its sole discretion."
        source: https://westjettravelagents.com/policy-library/ticketing-policy/
      - clause: Canadian OTA exclusivity / full-content style requirement
        text: >-
          "Online Travel Agencies located in Canada must have a sales incentive
          contract directly with WestJet or Book and Ticket through an Official
          WestJet Online Redistributor. Any OTA who does not have a sales contract
          with WestJet or Book and Ticket through an Official WestJet Online
          Redistributor will have their ability to Book and/or Ticket suspended
          and/or terminated and/or be liable for ADMs until they are in compliance
          with this policy."
        source: https://westjettravelagents.com/policy-library/ticketing-policy/
        note: >-
          This is the sharpest lock-in clause found. A Canadian OTA cannot simply
          integrate; it must hold a WestJet contract or route through a WestJet-
          designated redistributor, on pain of suspension.
      - clause: Accreditation as the definition of an eligible counterparty
        text: >-
          "'Accredited Agency' means an Agency approved by ARC or IATA to issue
          Airline Traffic Documents." … "'Non-Accredited Agency' means any
          entity/person, without ARC or IATA accreditation, who makes a Booking or
          otherwise issues Tickets, and for avoidance of doubt, will be deemed to
          include any travel agency whose bookings do not contain a valid ARC/IATA
          number of an Accredited Agency in the PNR point of sale information."
        source: https://westjettravelagents.com/policy-library/ticketing-policy/
      - clause: Interline restriction on 838 stock
        text: >-
          "4.12 Interline Ticketing – The Agent must not validate any Ticket on 838
          Ticket Stock if the Ticket contains a flight segment(s) on any other airline
          unless the other airline has a ticketing and baggage agreement with WestJet."
        source: https://westjettravelagents.com/policy-library/ticketing-policy/
      - clause: ADM issuance without floor
        text: >-
          "Minimum Amount — WestJet reserves the right to raise an ADM without
          limitation of minimum value." … "Timing — WestJet will raise and release ADMs
          no later than 9 months after transaction occurrence."
        source: https://westjettravelagents.com/policy-library/adm-policy/
      - clause: Dispute window
        text: >-
          "ADM disputes -Must be initiated during the pre-billing period (15 days from
          issue)" (BSPLink, Canadian and international agencies); "ADM disputes -Should
          be initiated within the first 15 days from issue" (ARC Memo Manager, U.S.
          agencies).
        source: https://westjettravelagents.com/policy-library/adm-policy/
      - clause: ADM administrative fees
        text: >-
          "Booking and inventory abuse — A charge of 10 CAD/USD will apply per
          incident, apart from churning violations which will apply per incident after
          the fourth churn in addition to the administration fee. 50 CAD/USD." …
          "Dual CRS — Administrative fee only. 50 CAD/USD." … "Group booking —
          Administrative fee only. 150 CAD/USD." … "Ticket validity … 150 CAD/USD."
        source: https://westjettravelagents.com/policy-library/adm-fee-schedule/
        note: >-
          The "Dual CRS" line item is a distribution-behaviour penalty: booking the
          same business through two reservation systems is itself a chargeable
          violation.
      - clause: Reinstatement after loss of ticketing authority
        text: >-
          "Ticketing Authority Reinstatement — Reinstatement will require back payment
          of any returned ADMs plus NSF fee of $50CAD/USD per instance along with a
          letter from IATA showing agency i[n good standing]"
        source: https://westjettravelagents.com/policy-library/adm-fee-schedule/
        note: Text truncated in the rendered page at the point quoted.
      - clause: Website terms — revocation at will
        text: >-
          "WestJet, in its absolute discretion, will be the sole judge of whether you
          have breached any provision of this Agreement and that any privileges or
          permission granted to you as an individual under this Agreement may be
          revoked, suspended or terminated by WestJet at any time without notice." …
          "WestJet may terminate this Agreement at any time with or without notice to
          you in its absolute discretion."
        source: https://www.westjet.com/en-ca/legal/terms-use
    notPublished:
      - Minimum term or committed volume for a Direct Connect agreement
      - Termination notice period for the Direct Connect or sales incentive contract
      - The NDC incentive schedule (stated to exist; values not published)
      - Full-content agreement text with any GDS
      - Any SLA or rate-limit commitment for the Direct Connect API
    note: >-
      Everything above is prose in public trade policy, not machine-readable terms.
      Nothing in the commercial agreement itself — the sales incentive contract that a
      Canadian OTA is required to hold — is published, and it is not inferred here.

  distributionModel:
    value: gds-intermediated
    asOfDate: '2026-07-28'
    reasoning: >-
      At the review date WestJet's live agency distribution is EDIFACT through
      Amadeus, Sabre and Travelport, plus its own direct agency web channel. NDC is
      documented and enrolling but not yet rolled out — the FAQ states "We intend to
      roll out NDC in Q4 of 2026." The model is therefore GDS-intermediated today with
      an ndc-direct posture in flight.
    channels:
      - name: WestJet Direct Connect API
        type: ndc-direct
        status: enrolling, pre-launch
      - name: WestJet portal (Accelya SPRK 17.2)
        type: ndc-direct-ui
        status: enrolling, pre-launch
      - name: Amadeus / Sabre / Travelport
        type: gds-intermediated
        status: live on EDIFACT; NDC largely marked Q3 2026 in the capability matrix
      - name: Travelfusion
        type: aggregator-reseller
        status: named technology partner, NDC 17.2
      - name: WestJet Agent Direct
        type: direct-only
        status: live; agency web app, no API
      - name: westjet.com and mobile app
        type: direct-only
        status: live; no public consumer API

  ndcPosture:
    certification:
      level: 'Level 2'
      grantedDate: '2017-03-22'
      announcedDate: '2017-05-01'
      evidence: >-
        WestJet newsroom: "On 22/03/2017, WestJet Airlines was granted 'NDC
        Certification' Level 2 status".
      source: https://westjet.mediaroom.com/2017-05-01-WestJet-receives-IATA-NDC-certification
      note: >-
        No higher certification level is claimed on westjetndc.com or in any WestJet
        release found. Level 3 or Level 4 status is NOT asserted here.
    apiPublished: true
    apiPubliclyDocumented: partial
    apiPubliclyCallable: false
    schemaVersions:
      - '17.2'
      - 21.3/24.1
    platform: Accelya FLX / Farelogix (SPRK 17.2 for the UI channel)
    plannedRollout: Q4 2026
    plannedRolloutEvidence: >-
      westjetndc.com/faq/: "We intend to roll out NDC in Q4 of 2026. Once live, we
      will have NDC connectivity with the three largest GDS platforms WestJet works
      with today (Amadeus, Sabre and Travelport), aggregators like TravelFusion and a
      direct connect option."
    gdsSurcharge:
      exists: true
      name: Distribution Cost Recovery (DCR) fee
      amount: $20-$22 USD
      scope: >-
        "The DCR surcharge will only apply to non-NDC bookings on the lowest class per
        cabin, ranging from $20-$22 USD." Applies "in markets where NDC content is
        available."
      source: https://westjetndc.com/benefits/
    contentDifferentiation:
      exists: true
      evidence: >-
        FAQ: "Once NDC launches, modernized pricing and all fare classes will be
        delivered through NDC-enabled channels. Specifically, UltraBasic fares will be
        exclusively available through NDC channels."
      benefitsMatrix: >-
        The EDIFACT/GDS column omits UltraBasic and marks "Modernized pricing" as
        "Not available", while the three NDC columns carry all seven fare bundles.
    pointsOfSale:
      ndc:
        - CA
        - US
        - UK
        - MX
      edifact:
        - CA
        - US
        - UK
        - MX
        - AU
        - BM
        - DE
        - DK
        - ES
        - FR
        - IE
        - IT
        - JP
        - KR
        - NL
        - PA
        - PT
      source: https://westjetndc.com/benefits/
    incentives:
      exists: true
      published: false
      evidence: >-
        FAQ: "Travel partners who integrate with WestJet's Direct Connect API will be
        eligible for incentives at launch." Values are not published.

  accessGate:
    value: accredited-or-licensed
    selfServe: false
    whatADeveloperMustDo:
      - >-
        Hold an IATA or ARC accreditation number. The Direct Connect registration form
        requires "Accreditation Type * — IATA / ARC / TIDS" and an "Accreditation
        Number *", and states plainly: "This form is only for Direct Connect API
        development, which does not support TIDS."
      - >-
        Declare a "Business Type" from a fixed list (Consolidator, Corporate Booking
        Tool, Metasearch Tool, Online Booking Tool, Online Travel Agency, Technology
        Provider, Tour Operator, Travel Agency).
      - >-
        Declare "Estimated Annual WestJet Sales Volume" — the form deflects
        "Less than $1M annually" with "Please consider connecting through a GDS or
        aggregator instead."
      - >-
        Declare the percentage of that volume expected to flow through the Direct
        Connect API, prior NDC implementation experience, and whether the applicant has
        completed a prior Accelya connection.
      - >-
        Request points of sale from CA, US, MX, UK only — "At this time, WestJet
        currently only supports Canada, US, Mexico and UK points of sale."
      - >-
        Wait for outreach: "A member of our team will contact you with further details
        on your registration." No credentials, sandbox, key or spec is issued on
        submission.
      - >-
        A Canadian OTA must additionally hold a WestJet sales incentive contract or
        ticket through an Official WestJet Online Redistributor.
      - >-
        For the non-API agency channel (WestJet Agent Direct), supply an
        "IATA / TIDS / ARC Number" and wait: "Your agency is now registered for WestJet
        Agent Direct. In the next 5 to 10 business days, you will receive an email with
        a link to access your agency's profile."
    sources:
      - https://westjetndc.com/direct-connect/
      - https://westjetagentdirect.westjet.com/registeragency.html
      - https://westjettravelagents.com/policy-library/ticketing-policy/

  consumerVsDistributionSurfaces:
    consumer:
      publicAPI: false
      note: >-
        Flight status, check-in, manage-trips, seat selection and WestJet Rewards are
        web and mobile-app only. westjet.com/llms.txt enumerates every guest journey as
        an HTML deep link; none is an API. No public flight-status, schedule or loyalty
        endpoint is documented. A .well-known/apple-app-site-association exists for
        mobile deep linking, which is not an API contract.
    distribution:
      publicAPI: true
      publiclyCallable: false
      note: >-
        The WestJet Direct Connect NDC API is the only real API surface, and it is
        accreditation-gated with no published spec or base URL.
    cargo:
      publicAPI: false
      note: >-
        westjetcargo.com publishes quote, track and claim web forms; tracking is
        delegated to the third-party SmartKargo platform at westjet.smartkargo.com. No
        cargo API, no IATA ONE Record reference found.
    lowCostCarrierContext: >-
      WestJet began as a low-cost carrier that historically leaned on direct sales, and
      the current posture still reads that way: it is building its NDC channel to pull
      volume back from the GDS, gating its cheapest fare bundle (UltraBasic) to direct
      and NDC channels, and pricing the GDS channel up by $20-$22 USD per booking. This
      is the same structural move that easyJet, Jet2, Jetstar and Southwest made by
      bypassing the GDS outright — the difference is that WestJet is doing it through
      IATA's standard rather than around it.

