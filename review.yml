aid: westjet
name: WestJet
review:
  question: >-
    Does WestJet publish a public developer/API surface, and what would it cost a
    customer of WestJet's distribution to leave?
  answer: partial
  date: '2026-07-28'
  reviewer: API Evangelist
  summary: >-
    WestJet publishes no developer portal, no self-serve signup, no OpenAPI, no
    WSDL/XSD and no consumer API. It does publish a real, public, human-readable
    NDC hub at westjetndc.com documenting a WestJet Direct Connect API in IATA
    NDC schema 17.2 and 21.3/24.1, with a capability matrix, benefits matrix,
    release notes, technical-support routing and an application form. Access is
    accreditation-gated (IATA or ARC number; TIDS explicitly not supported for
    the API) and approval-based. The API itself is built and hosted on Accelya's
    FLX/Farelogix platform, not on WestJet infrastructure.

