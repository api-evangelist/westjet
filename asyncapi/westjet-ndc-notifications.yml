description: >-
  WestJet publishes NO AsyncAPI document and no event schema. It does advertise one
  asynchronous, carrier-to-seller notification capability on the Direct Connect API:
  "Schedule change notifications (OCN)" — the IATA NDC OrderChangeNotification
  message. This artifact records that event surface as advertised in the public
  capability matrix. No endpoint, subscription mechanism, delivery guarantee,
  retry policy, payload schema or signature scheme is published; the message shape
  is defined by the IATA NDC schema (17.2 / 21.3/24.1), which IATA distributes, not
  WestJet. Nothing here is derived from a machine-readable contract because none
  exists.
delivery_model: >-
  Carrier-push asynchronous notification within the NDC message set (IATA NDC
  OrderChangeNotification), not an HTTP webhook with a subscriber-registered
  callback URL. WestJet publishes no registration or callback configuration.
