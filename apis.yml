name: WestJet
kind: company
description: >-
  WestJet Airlines Ltd. is Canada's second-largest air carrier, headquartered in
  Calgary, Alberta, operating scheduled passenger service to more than 100
  destinations across Canada, the United States, Mexico, Central America, the
  Caribbean, Europe and Asia, alongside WestJet Encore, WestJet Vacations,
  WestJet Cargo and the Sunwing Vacations Group. In the distribution chain
  WestJet sits upstream of the agency channel: its inventory reaches travel
  sellers today through EDIFACT in the Amadeus, Sabre and Travelport GDSs, and
  it is standing up an IATA NDC surface (schema 17.2 and 21.3/24.1) built and
  hosted on Accelya's FLX/Farelogix platform, with a stated Q4 2026 rollout. Its
  API posture is honest but closed: there is no public developer portal, no
  self-serve signup, no OpenAPI or WSDL and no consumer API. The WestJet
  Direct Connect API is documented only as a public capability matrix at
  westjetndc.com, and access requires an IATA or ARC accreditation number (TIDS
  is explicitly not supported), a business-type and sales-volume qualification
  form, and WestJet approval. Agency booking through WestJet Agent Direct
  likewise requires an IATA/TIDS/ARC number and a five-to-ten business day
  review. There is no bulk export for agency or booking data; guest data comes
  out only via a verbally authenticated PIPEDA-style "Guest information report"
  request.
