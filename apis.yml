apis:
- aid: westjet:westjet-direct-connect-api
  name: WestJet Direct Connect API
  description: >-
    WestJet's IATA New Distribution Capability (NDC) direct-connect interface for
    travel sellers, offered in NDC schema versions 17.2 and 21.3/24.1 and
    delivered on Accelya's FLX/Farelogix platform. Published capability tables
    cover shopping (fare brands, fare types, complex itineraries, promo codes),
    ancillaries (EMD-A for bags and pre-reserved seats, seat maps), order
    creation (book-and-hold, book-and-instant-ticket), payment and ticketing
    (credit/debit, BSP and ARC cash, UATP, multiple forms of payment), settlement
    via BSP and ARC, change notifications (OCN), and servicing (CAT 33 voluntary
    refunds, True Reshop, waiver codes, split/divide PNR, SSR and OSI updates).
    No OpenAPI, WSDL, XSD or base URL is published; enrolment is by application
    and requires an IATA or ARC accreditation number. WestJet states a Q4 2026
    rollout, with a $20-$22 USD Distribution Cost Recovery surcharge applying to
    non-NDC (EDIFACT) bookings on the lowest class per cabin in NDC-enabled
    points of sale.
  humanURL: https://westjetndc.com/connection-options/
