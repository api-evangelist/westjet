      - Returns the best available option within each fare brand
      - Applies discounted fares (corporate ID, promo codes, private fares) during re-shopping
      - Supports up to three exchanges per booking
      - Modify unused segments on partially flown tickets; add new flights to an existing itinerary
      - Switch between round-trip and one-way itineraries; limit offers to private, public or both
