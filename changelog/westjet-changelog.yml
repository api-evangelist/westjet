  - version: '11.3'
    date: '2025-09-02'
    feature_area: True Reshop, voluntary exchange, pre-paid bags
    title: True Reshop, CAT31 automated voluntary exchanges, pre-paid bags
    breaking: []
    additions:
      - >-
        Bags — NDC API users can prepay for the first and second checked bags in
        WestJet NDC-enabled channels, directly in both the NDC API and SPRK booking
        flows rather than being directed to Manage Trips post-booking.
      - >-
        True Reshop — fully explore all available market offers when changing an
        existing booking, beyond the limitations of the original order.
      - >-
        Category 31 automated voluntary exchanges, fully compatible with True Reshop.
    highlights:
