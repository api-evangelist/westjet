description: >-
  WestJet publishes a dated release-notes page for its NDC platform, produced with
  its technology partner Accelya. Each entry carries a "Release Version", an
  "Effective date" and a "Feature area". The versions are Accelya FLX platform
  release numbers (11.x), not API or NDC schema versions — the NDC schema versions
  WestJet supports (17.2 and 21.3/24.1) are stated separately on the capabilities
  and connection-options pages. No machine-readable changelog feed (RSS, JSON) is
  published; this artifact captures the recent window, the live page is the source
  of truth.
