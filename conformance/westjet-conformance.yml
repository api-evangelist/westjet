    source: https://westjetndc.com/capabilities/
  - id: arc-settlement
    name: ARC settlement (Airlines Reporting Corporation / Memo Manager)
    conforms: true
    evidence: >-
      Capability matrix row "Settlement via ARC"; US agency ADM disputes routed
