    source: https://westjettravelagents.com/policy-library/adm-policy/
  - id: iata-resolution-850m
    name: IATA Resolution 850m (ADM audit and issuance)
    conforms: true
    evidence: >-
      ADM policy: "The WestJet policy for audit and memo issuance will be handled
