source: >-
  Derived from the evidence captured in review.yml (all URLs fetched 2026-07-28):
  https://westjetndc.com/connection-options/, https://westjetndc.com/capabilities/,
  https://westjetndc.com/benefits/, https://westjetndc.com/faq/,
  https://westjettravelagents.com/policy-library/adm-policy/,
  https://westjettravelagents.com/policy-library/ticketing-policy/,
