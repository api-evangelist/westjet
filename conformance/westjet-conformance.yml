description: >-
  WestJet's conformance surface is almost entirely IATA airline-distribution
  standards rather than web-API standards. The wire format for the Direct Connect
  API is IATA NDC (schema 17.2 and 21.3/24.1) delivered on Accelya FLX/Farelogix;
  settlement runs through IATA BSP and ARC; agency obligations are governed by
  IATA Resolutions 824 and 850m. None of the common web-API conventions (OpenAPI,
  OAuth 2.0 discovery, RFC 9457 problem details, RFC 8594 sunset headers) are
  published, because no public machine-readable contract exists.
standards:
  - id: iata-ndc
    name: IATA New Distribution Capability
    conforms: true
    versions:
      - '17.2'
      - 21.3/24.1
    evidence: >-
      westjetndc.com/connection-options/: "Travel partners with an existing user
      interface and technical infrastructure can integrate directly with WestJet's
      Direct Connect API. This option is available in versions 17.2 or 21.3/24.1."
      The Direct Connect registration form's "NDC API Version" field offers
      "NDC 17.2", "NDC 21.3/24.1" and "NDC SPRK (17.2)".
    source: https://westjetndc.com/connection-options/
  - id: iata-ndc-certification
    name: IATA NDC Certification
    conforms: true
    level: Level 2
    granted: '2017-03-22'
    evidence: >-
      WestJet newsroom: "On 22/03/2017, WestJet Airlines was granted 'NDC
      Certification' Level 2 status". No higher level is claimed on westjetndc.com
      or in any WestJet release located.
    source: https://westjet.mediaroom.com/2017-05-01-WestJet-receives-IATA-NDC-certification
  - id: iata-edifact
    name: IATA/ATA EDIFACT (Type B / GDS messaging)
    conforms: true
    evidence: >-
      westjetndc.com/benefits/ contrasts an "EDIFACT" channel column against the
      "NDC (17.2 and 21.3/24.1)" columns; EDIFACT is the live agency interface in
      Amadeus, Sabre and Travelport at review date.
    source: https://westjetndc.com/benefits/
  - id: iata-resolution-824
    name: IATA Resolution 824 (Passenger Sales Agency Agreement)
    conforms: true
    evidence: >-
      ADM policy: "Agency obligations are described in IATA Resolution 824, which
      states that an Agent should issue tickets in compliance with Carrier's fares,
      fare rules, general conditions of carriage and written instructions of the
